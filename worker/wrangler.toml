name = "silviorodrigues-subscribe"
main = "worker.js"
compatibility_date = "2026-08-23"

# Non-secret configuration. Edit these before the first `wrangler deploy`.
[vars]
# Id of the Resend audience new subscribers are added to (Resend dashboard →
# Audiences). Not a secret, but it is account-specific — replace the placeholder.
RESEND_AUDIENCE_ID = "REPLACE_WITH_RESEND_AUDIENCE_ID"
# Comma-separated origins allowed to POST to this Worker (CORS).
ALLOWED_ORIGINS = "https://silviorodrigues.dev"

# RESEND_API_KEY is intentionally absent: set it as a secret, never in this file.
#   wrangler secret put RESEND_API_KEY
